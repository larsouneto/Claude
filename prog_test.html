 <div id="chipw" style="left:0px;top:0px"><div style="position:absolute;left:1650px;top:34px;width:230px;height:70px;box-sizing:border-box;background:#ffd21f;border:6px solid #000;border-radius:16px;box-shadow:8px 8px 0 #000;display:flex;align-items:center;justify-content:center;padding:0 14px;transform:rotate(0deg)" data-k="chip"><span style="font-family:'Lilita One',sans-serif;font-weight:400;font-size:38px;line-height:1;color:#000;" data-k="chiptext">JOUR 1 / 3</span></div></div>

<script>
const CFG={room:'',server:'https://ntfy.sh'};
(function(){const q=new URLSearchParams(location.search);if(q.get('room'))CFG.room=q.get('room');if(q.get('server'))CFG.server=q.get('server').replace(/\/$/,'');})();
const TOPIC='slice-roue-'+CFG.room;
// Bus : relais ntfy (distance) + BroadcastChannel (même navigateur)
const PTOPIC='slice-prog-'+CFG.room;
function makeBus(onState,onStatus,topic){
  const T=topic||TOPIC,base=CFG.server+'/'+T, seen=new Set();
  let es=null,last=0,bc=null;
  try{bc=new BroadcastChannel(T);bc.onmessage=e=>{if(e.data&&e.data.v===1)onState(e.data,false)}}catch(e){}
  function handle(raw,id,initial){
    if(id){if(seen.has(id))return;seen.add(id)}
    let m;try{m=JSON.parse(raw)}catch(e){return}
    if(m&&m.v===1&&m.type==='state')onState(m,initial);
  }
  async function init(){
    try{
      const r=await fetch(base+'/json?poll=1&since=12h');
      const lines=(await r.text()).split('\n').filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(x=>x&&x.event==='message');
      const lm=lines[lines.length-1];
      if(lm){handle(lm.message,lm.id,true);last=lm.time}
      onStatus('ok');
    }catch(e){onStatus('err')}
    connect();
  }
  function connect(){
    try{es&&es.close()}catch(e){}
    es=new EventSource(base+'/sse?since='+(last||Math.floor(Date.now()/1000)));
    es.addEventListener('open',()=>onStatus('ok'));
    es.addEventListener('message',e=>{try{const d=JSON.parse(e.data);if(d.event==='message'){last=d.time||last;handle(d.message,d.id,false)}}catch(x){}});
    es.onerror=()=>{onStatus('err');try{es.close()}catch(e){}setTimeout(connect,3000)};
  }
  async function send(m){
    try{bc&&bc.postMessage(m)}catch(e){}
    try{
      const r=await fetch(base,{method:'POST',body:JSON.stringify(m)});
      onStatus(r.ok?'ok':'err');return r.ok;
    }catch(e){onStatus('err');return false}
  }
  init();
  return {send};
}

const $=s=>document.querySelector(s);
const dbg=new URLSearchParams(location.search).get('debug')==='1';if(dbg)$('#dbg').style.display='block';
const q=(k,i)=>document.querySelector(`#lad [data-k=${k}]`+(i!=null?`[data-i="${i}"]`:''));
const NAMES=['SILVER','GOLD','DIAMOND','MYTHIC','LEGENDARY','MASTERS 1'];
const base={};document.querySelectorAll('#lad [data-k]').forEach(e=>base[e.dataset.k+(e.dataset.i??'')]=e.getAttribute('style'));
document.querySelectorAll('#lad [data-k=label]').forEach(l=>{const sp=l.querySelector('span');base['sp'+l.dataset.i]=sp.getAttribute('style')});
let rev=0,cur=null,day=null;
function center(i){const o=q('outer',i);return parseFloat(o.style.left)+parseFloat(o.style.width)/2}
function paint(rank){
  for(let i=0;i<6;i++){
    const o=q('outer',i),n=q('inner',i),l=q('label',i),sp=l.querySelector('span');
    const sty=k=>base[k+i];
    o.setAttribute('style',sty('outer'));n.setAttribute('style',sty('inner'));l.setAttribute('style',sty('label'));
    sp.setAttribute('style',base['sp'+i]);
    if(i<5){const on=i<=rank;n.style.backgroundColor=on?'#ffd21f':'#fff';sp.style.color=on?'#ffd21f':'#fff'}
    if(i===rank){o.style.transform=n.style.transform='scale(1.3)';sp.style.fontSize='30px';l.style.marginTop='4px'}
  }
  const line=q('line');
  const w=center(rank)-parseFloat(line.style.left)-3;
  const bar=$('#bar');bar.style.left=(parseFloat(line.style.left)+3)+'px';bar.style.top=(parseFloat(line.style.top)+3)+'px';
  requestAnimationFrame(()=>bar.style.width=Math.max(0,w)+'px');
}
function confetti(rank){
  const o=q('outer',rank),r=o.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const cols=['#ffd21f','#a6ff1f','#fff','#ff5fa2','#8a4af0'],star='polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
  const N=rank===5?70:28;
  for(let i=0;i<N;i++){
    const d=document.createElement('div'),s=18+Math.random()*30,a=Math.random()*Math.PI*2,dist=(rank===5?260:150)+Math.random()*(rank===5?520:220);
    d.style.cssText=`position:absolute;left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;background:${cols[i%5]};clip-path:${star};pointer-events:none`;
    $('#root').appendChild(d);
    d.animate([{transform:'translate(0,0) scale(.2) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist-60}px) scale(1) rotate(${Math.random()*540}deg)`,opacity:1,offset:.65},{transform:`translate(${Math.cos(a)*dist*1.1}px,${Math.sin(a)*dist*1.1+90}px) scale(.7) rotate(600deg)`,opacity:0}],{duration:1300+Math.random()*500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove();
  }
}
function apply(m,initial){
  if(m.rev<=rev)return;rev=m.rev;
  const rank=Math.max(0,Math.min(5,+m.rank||0)),d=Math.max(1,Math.min(3,+m.day||1));
  const up=cur!==null&&rank>cur&&!initial;
  paint(rank);
  if(d!==day){const t=document.querySelector('#chipw [data-k=chiptext]');if(t){t.textContent='JOUR '+d+' / 3';if(day!==null&&!initial)t.parentElement.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:500,easing:'ease-out'})}day=d}
  if(up)setTimeout(()=>confetti(rank),350);
  cur=rank;
  try{localStorage.setItem('prog_last_'+CFG.room,JSON.stringify({rev:m.rev,rank,day:d}))}catch(e){}
  if(dbg)$('#dbg').textContent='rev '+m.rev+' | rang '+NAMES[rank]+' | jour '+d;
}
document.fonts.load("40px 'Lilita One'").then(()=>document.fonts.ready).then(()=>{
  let st0={rev:1,rank:0,day:1};try{const j=JSON.parse(localStorage.getItem('prog_last_'+CFG.room));if(j&&j.rank!=null)st0=j}catch(e){}
  apply(st0,true);rev=st0.rev>1?st0.rev:0;
  makeBus(apply,s=>{if(dbg)$('#dbg').textContent='relais : '+s},PTOPIC);
});
</script></body></html>
